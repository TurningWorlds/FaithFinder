<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faith Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <div id="screen-intro" class="screen active">
    <div class="intro-header">
      <h1>Faith Finder</h1>
      <p>A deep, detailed quiz mapping your beliefs, practices, and convictions to the Christian tradition you actually belong to — or belong nearest to. Answer honestly. There are no wrong answers.<br><br>Covers ~55 denominations. Takes 5–15 minutes.</p>
    </div>
    <button class="start-btn" onclick="startQuiz()">Begin →</button>
  </div>

  <div id="screen-quiz" class="screen">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div id="trail-container" class="trail"></div>
    <div class="q-meta">
      <span class="q-num" id="q-counter">Question 1</span>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="q-sub" id="q-subtext"></div>
    <div class="opts" id="options-list"></div>
    <div class="nav-row">
      <button class="back-btn" id="btn-back" onclick="goBack()" disabled>← Back</button>
    </div>
  </div>

  <div id="screen-result" class="screen">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill2" style="width:100%"></div>
    </div>
    <div class="result-family" id="result-tradition-family"></div>
    <div class="result-name" id="result-denom-name"></div>
    <div class="result-tagline" id="result-tagline"></div>
    <div class="divider"></div>
    <div class="result-desc" id="result-desc"></div>
    <div class="traits" id="result-traits"></div>
    <div class="path-section">
      <h3>Your path through the quiz</h3>
      <div id="path-taken"></div>
    </div>
    <button class="restart-btn" onclick="restartQuiz()">Start over</button>
  </div>

</div>

<script src="quiz.js"></script>
</body>
</html>
